<!DOCTYPE html>
<html lang="en">
<head>
    <title>Railfence Cipher</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"/>
</head>
<body>
    <h6 class="text-center text-secondary font-italic mb-4 pb-3 border-bottom">
                Tran Truong Thinh - 2380613944
            </h6>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">RAILFENCE CIPHER</td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence/encrypt" onsubmit="return validateEncrypt()">
                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text" class="form-control" id="inputPlainText" name="inputPlainText" placeholder="Input Plain Text" required autofocus/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" id="inputRailsPlain" name="inputRailsPlain" placeholder="Input Rails" min="2" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Encrypt</button>
                    </form>
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color: blue">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="POST" action="/railfence/decrypt" onsubmit="return validateDecrypt()">
                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text" class="form-control" id="inputCipherText" name="inputCipherText" placeholder="Input cipher Text" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number" class="form-control" id="inputRailsCipher" name="inputRailsCipher" placeholder="Input Rails" min="2" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Decrypt</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>

    <script>
        function validateEncrypt() {
            const text = document.getElementById('inputPlainText').value;
            const rails = parseInt(document.getElementById('inputRailsPlain').value);
            
            if (rails >= text.length) {
                alert('Khóa (Rails) phải nhỏ hơn độ dài của Plain text (' + text.length + ' ký tự)!');
                return false; 
            }
            return true;
        }

        function validateDecrypt() {
            const text = document.getElementById('inputCipherText').value;
            const rails = parseInt(document.getElementById('inputRailsCipher').value);
            
            if (rails >= text.length) {
                alert('Khóa (Rails) phải nhỏ hơn độ dài của Cipher text (' + text.length + ' ký tự)!');
                return false; 
            }
            return true;
        }
    </script>
</body>
</html>
