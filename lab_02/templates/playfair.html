<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playfair Cipher</title>


<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">


</head>
<body>
<h6 class="text-center text-secondary font-italic mb-4 pb-3 border-bottom">
                Tran Truong Thinh - 2380613944
            </h6>
<div class="container mt-4">


<h1 class="text-center">Playfair Cipher</h1>

<hr>

<h3>Encryption</h3>

<form action="/playfair/encrypt" method="POST">

    <div class="form-group">
        <label>Plain Text</label>
        <input type="text"
               class="form-control"
               name="inputPlainText"
               required>
    </div>

    <div class="form-group">
        <label>Key</label>
        <input type="text"
               class="form-control"
               name="inputKey"
               required>
    </div>

    <button type="submit"
            class="btn btn-success">
        Encrypt
    </button>

</form>

<hr>

<h3>Decryption</h3>

<form action="/playfair/decrypt" method="POST">

    <div class="form-group">
        <label>Cipher Text</label>
        <input type="text"
               class="form-control"
               name="inputCipherText"
               required>
    </div>

    <div class="form-group">
        <label>Key</label>
        <input type="text"
               class="form-control"
               name="inputKey"
               required>
    </div>

    <button type="submit"
            class="btn btn-danger">
        Decrypt
    </button>

</form>


</div>

</body>
</html>
